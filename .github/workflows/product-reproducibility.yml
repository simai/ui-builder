name: Product reproducibility

on:
  workflow_dispatch:
    inputs:
      ui_source_ref:
        description: Exact ui-source branch, tag or SHA
        required: true
        default: main

permissions:
  contents: read

jobs:
  build-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Utility generation exceeds Node's ~2 GiB default heap on the hosted
      # runner, while the same frozen build completes reproducibly with a
      # bounded 4 GiB heap. Keep the limit explicit and below runner memory.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout ui-builder
        uses: actions/checkout@v7
        with:
          path: ui-builder

      # simai/ui-source is public from 2026-10-13 and starts from a snapshot;
      # a revision of an earlier release lives only in the private record,
      # simai/ui-source-history, which needs the read token.
      - name: Checkout ui-source
        id: public-source
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: simai/ui-source
          ref: ${{ inputs.ui_source_ref }}
          path: ui-source

      - name: Checkout ui-source-history (revisions before the public history)
        if: steps.public-source.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          repository: simai/ui-source-history
          ref: ${{ inputs.ui_source_ref }}
          token: ${{ secrets.UI_LOADER_READ_TOKEN }}
          path: ui-source

      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.5

      - name: Build two frozen product waves
        run: >-
          node ui-builder/scripts/verify-product-reproducibility.cjs
          "$GITHUB_WORKSPACE/ui-source"
          "$RUNNER_TEMP/ui-builder-product-reproducibility"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-reproducibility-${{ github.sha }}
          path: ${{ runner.temp }}/ui-builder-product-reproducibility
          if-no-files-found: error
          retention-days: 14
