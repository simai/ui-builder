name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    # Both platforms: a package built on a Mac must reproduce in Linux CI, and
    # the gzip test pins bytes that only hold if they do.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - run: yarn run verify
