name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
          cache: yarn

      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - run: yarn run verify
